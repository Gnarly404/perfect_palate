<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfect Palate - Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --b: #426e86;
      --bd: #2a4d63;
      --a: #e2ba2e;
      --tx: #1c2b35;
      --mu: #6e7e88;
      --off: #faf8f4;
      --card: #fff;
    }
    body {
      font-family: 'Syne', sans-serif;
      background: var(--off);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: var(--tx);
    }
    .auth-panel {
      width: min(100%, 520px);
      background: var(--card);
      border-radius: 22px;
      padding: 2rem;
      border: 1px solid rgba(66,110,134,.12);
      box-shadow: 0 24px 72px rgba(42,77,99,.16);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 1rem;
    }
    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--tx);
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 2rem;
      line-height: 1;
      margin: 0 0 .6rem;
    }
    .sub {
      color: var(--mu);
      font-size: .75rem;
      line-height: 1.55;
      margin-bottom: 1.2rem;
    }
    label {
      display: block;
      font-size: .66rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--mu);
      margin-bottom: .38rem;
    }
    input {
      width: 100%;
      background: var(--off);
      border: 1.5px solid rgba(66,110,134,.13);
      border-radius: 10px;
      padding: .72rem .85rem;
      font-family: 'Syne', sans-serif;
      font-size: .8rem;
      outline: none;
      transition: .2s;
    }
    input:focus {
      border-color: var(--b);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(66,110,134,.1);
    }
    button {
      width: 100%;
      margin-top: 1rem;
      background: var(--b);
      color: white;
      border: none;
      border-radius: 50px;
      padding: .74rem;
      font-family: 'Syne', sans-serif;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:hover { background: var(--bd); }
    .alt {
      margin-top: 1rem;
      font-size: .7rem;
      color: var(--mu);
      text-align: center;
    }
    .alt a {
      color: var(--b);
      font-weight: 800;
      text-decoration: none;
    }
    .msg {
      margin-top: .8rem;
      display: none;
      padding: .56rem .7rem;
      border-radius: 8px;
      font-size: .68rem;
      font-weight: 700;
    }
    .msg.ok { display: block; background: rgba(45,106,79,.08); color: #2d6a4f; }
    .msg.err { display: block; background: rgba(139,32,32,.08); color: #8b2020; }
  </style>
</head>
<body>
  <section class="auth-panel">
    <div class="brand">
      <span class="brand-name">Perfect Palate</span>
    </div>
    <h1>Reset your password</h1>
    <div class="sub">Enter the email address linked to your account and we’ll send a secure reset link.</div>

    <div id="forgotFormArea">
      <label for="emailInput">Email address</label>
      <input id="emailInput" type="email" placeholder="you@example.com" autocomplete="username">
      <div id="forgotMsg" class="msg"></div>
      <button id="forgotButton" onclick="requestReset()">Send reset link</button>
    </div>

    <div class="alt">
      <a href="{{ url_for('sign_in') }}">Back to sign in</a>
    </div>
  </section>

  <script>
    function showMessage(text, kind) {
      const el = document.getElementById('forgotMsg');
      el.className = 'msg ' + (kind === 'ok' ? 'ok' : 'err');
      el.textContent = text;
    }

    function requestReset() {
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      if (!email) {
        showMessage('Please enter your email address.', 'err');
        return;
      }

      const button = document.getElementById('forgotButton');
      button.disabled = true;
      button.textContent = 'Sending...';

      fetch('{{ url_for("forgot_password") }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      })
        .then(res => res.json().then(data => ({ ok: res.ok, data })))
        .then(({ ok, data }) => {
          button.disabled = false;
          button.textContent = 'Send reset link';
          if (ok && data.status === 'ok') {
            showMessage(data.message || 'If an account exists, a reset link has been sent.', 'ok');
          } else {
            showMessage(data.message || 'Unable to process your request.', 'err');
          }
        })
        .catch(() => {
          button.disabled = false;
          button.textContent = 'Send reset link';
          showMessage('Network error. Please try again.', 'err');
        });
    }
  </script>
</body>
</html>
