<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <title>Perfect Palate - Shopping List</title>
<style>.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>
</head>
<body>
<style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
    --b:#426e86;--bd:#2a4d63;--bl:rgba(66,110,134,.07);
    --a:#e2ba2e;--ad:#b8941f;
    --tx:#1c2b35;--mu:#6e7e88;--off:#faf8f4;--card:#fff;
    --sh:0 4px 20px rgba(42,77,99,.09);--shh:0 12px 36px rgba(42,77,99,.18);
    --cp:#2d6a4f;--cpr:#8b2020;--cpa:#ad8420;--cpd:#426e86;
    }
    body{font-family:'Syne',sans-serif;color:var(--tx);background:var(--off)}
    #slMain{max-width:1320px;margin:0 auto}
    .nav{background:var(--b);height:56px;display:flex;align-items:center;padding:0 1.6rem;gap:.8rem}
    .nav-logo{display:flex;align-items:center;gap:.5rem}
    .nav-lt{font-family:'Cormorant Garamond',serif;font-size:1.08rem;font-weight:600;color:#fff;letter-spacing:.8px}
    .nav-links{display:flex;gap:.1rem;margin-left:auto}
    .nav-links a{font-size:.65rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.6);text-decoration:none;padding:.38rem .75rem;border-radius:6px;transition:.18s}
    .nav-links a.on,.nav-links a:hover{color:var(--a);background:rgba(226,186,46,.1)}

    .pg-head{padding:1.8rem 1.8rem 0;display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;opacity:0}
    .pg-left{}
    .pg-eye{font-size:.62rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--a);display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
    .pg-eye::before{content:'';display:block;width:24px;height:2px;background:var(--a)}
    .pg-h1{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:300;line-height:.95;letter-spacing:-.5px}
    .pg-h1 em{font-style:italic;color:var(--b)}
    .pg-h1 strong{font-weight:600;color:var(--bd)}

    .prog-ring-wrap{display:flex;flex-direction:column;align-items:center;gap:.3rem;flex-shrink:0}
    .prog-svg{width:80px;height:80px}
    .prog-bg{fill:none;stroke:rgba(66,110,134,.12);stroke-width:7}
    .prog-arc{fill:none;stroke:var(--a);stroke-width:7;stroke-linecap:round;stroke-dasharray:220;stroke-dashoffset:220;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)}
    .prog-num{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;fill:var(--tx);dominant-baseline:central}
    .prog-sub{font-family:'Syne',sans-serif;font-size:.5rem;font-weight:700;fill:var(--mu);dominant-baseline:central;letter-spacing:.5px}
    .prog-label{font-size:.6rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu);text-align:center}

    .add-bar{margin:1.4rem 1.8rem;background:var(--card);border-radius:14px;padding:.7rem .8rem;display:flex;gap:.6rem;align-items:center;box-shadow:var(--sh);border:1.5px solid rgba(66,110,134,.1);opacity:0}
    .add-inp{flex:1;border:none;outline:none;background:transparent;font-family:'Syne',sans-serif;font-size:.85rem;color:var(--tx)}
    .add-inp::placeholder{color:rgba(110,126,136,.5)}
    .add-cat{appearance:none;border:1.5px solid rgba(66,110,134,.15);border-radius:50px;padding:.42rem .9rem .42rem .7rem;font-family:'Syne',sans-serif;font-size:.7rem;font-weight:700;color:var(--mu);background:var(--off);outline:none;cursor:pointer}
    .add-btn{background:var(--b);color:#fff;border:none;border-radius:50px;padding:.5rem 1.1rem;font-family:'Syne',sans-serif;font-size:.72rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:.35rem;transition:.18s;white-space:nowrap}
    .add-btn:hover{background:var(--bd)}

    .body{padding:0 1.8rem 1rem;display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}

    .cat-section{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--sh);opacity:0;transform:translateY(16px)}
    .cat-head{padding:.8rem 1rem;display:flex;align-items:center;gap:.7rem;border-bottom:1px solid rgba(66,110,134,.07)}
    .cat-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0}
    .cat-produce .cat-icon{background:rgba(45,106,79,.1);color:var(--cp)}
    .cat-protein .cat-icon{background:rgba(139,32,32,.08);color:var(--cpr)}
    .cat-pantry  .cat-icon{background:rgba(173,132,32,.1);color:var(--cpa)}
    .cat-dairy   .cat-icon{background:rgba(66,110,134,.1);color:var(--cpd)}
    .cat-name{font-size:.65rem;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;flex:1}
    .cat-produce .cat-name{color:var(--cp)}
    .cat-protein .cat-name{color:var(--cpr)}
    .cat-pantry  .cat-name{color:var(--cpa)}
    .cat-dairy   .cat-name{color:var(--cpd)}
    .cat-count{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;color:var(--mu)}

    .items-list{list-style:none;padding:.3rem 0}
    .sl-item{display:flex;align-items:center;gap:.7rem;padding:.62rem 1rem;border-bottom:1px solid rgba(66,110,134,.05);transition:background .18s}
    .sl-item:last-child{border-bottom:none}
    .sl-item:hover{background:rgba(66,110,134,.03)}
    .sl-item.done{opacity:.48}

    .cb-wrap{flex-shrink:0;cursor:pointer}
    .cb{width:20px;height:20px;border-radius:50%;border:2px solid rgba(66,110,134,.25);display:flex;align-items:center;justify-content:center;transition:.18s;font-size:.6rem;color:transparent}
    .cat-produce .cb.checked{background:var(--cp);border-color:var(--cp);color:#fff}
    .cat-protein .cb.checked{background:var(--cpr);border-color:var(--cpr);color:#fff}
    .cat-pantry  .cb.checked{background:var(--cpa);border-color:var(--cpa);color:#fff}
    .cat-dairy   .cb.checked{background:var(--cpd);border-color:var(--cpd);color:#fff}

    .sl-info{flex:1;min-width:0}
    .sl-name{font-size:.8rem;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;display:inline-block;transition:opacity .25s}
    .sl-name.struck{text-decoration:line-through;color:var(--mu)}
    .sl-qty{font-size:.65rem;color:var(--mu);margin-top:.1rem}
    .sl-src{font-size:.58rem;font-weight:700;letter-spacing:.5px;color:rgba(66,110,134,.5);background:rgba(66,110,134,.07);border-radius:20px;padding:.1rem .45rem;white-space:nowrap;display:inline-block;margin-top:.2rem}

    .sl-del{background:none;border:none;cursor:pointer;color:rgba(110,126,136,.35);font-size:.7rem;padding:.2rem;border-radius:4px;transition:.18s;flex-shrink:0}
    .sl-del:hover{color:#c0392b;background:rgba(192,57,43,.08)}

    .footer-bar{margin:0 1.8rem 2rem;background:var(--b);border-radius:14px;padding:1rem 1.4rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;opacity:0}
    .ft-info{color:#fff}
    .ft-main{font-family:'Cormorant Garamond',serif;font-size:1.05rem;font-weight:600}
    .ft-sub{font-size:.68rem;opacity:.7;margin-top:.12rem}
    .ft-actions{display:flex;gap:.6rem}
    .ft-btn{border:1.5px solid rgba(255,255,255,.3);background:transparent;border-radius:50px;padding:.45rem .9rem;font-family:'Syne',sans-serif;font-size:.68rem;font-weight:700;color:rgba(255,255,255,.8);cursor:pointer;transition:.18s;display:flex;align-items:center;gap:.35rem}
    .ft-btn:hover{background:rgba(255,255,255,.15);color:#fff}
    .ft-btn.amber{background:var(--a);border-color:var(--a);color:#1c2b35}
    .ft-btn.amber:hover{filter:brightness(1.07)}

    .toast-wrap{position:absolute;bottom:1rem;right:1rem;display:flex;flex-direction:column;gap:.4rem;z-index:50}
    .toast{background:var(--b);color:#fff;padding:.55rem .9rem;border-radius:8px;font-family:'Syne',sans-serif;font-size:.72rem;font-weight:700;animation:tIn .3s cubic-bezier(.34,1.56,.64,1)}
    @keyframes tIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

    @media (max-width: 1024px){
      .body{grid-template-columns:1fr;padding:0 1.4rem 1rem}
      .pg-head{padding:1.4rem 1.4rem 0;flex-wrap:wrap}
      .footer-bar{margin:0 1.4rem 1.6rem;flex-wrap:wrap}
    }
    @media (max-width: 640px){
      .nav-links{gap:.5rem;font-size:.66rem;flex-wrap:wrap}
      .body{padding:0 1rem .8rem}
      .pg-head{padding:1.2rem 1rem 0}
      .footer-bar{margin:0 1rem 1.4rem;padding:1rem;flex-direction:column;align-items:stretch;text-align:center}
    }
    </style>

    <div style="position:relative" id="slMain">

    <nav class="nav">
    <div class="nav-logo">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="13" r="12" stroke="rgba(226,186,46,.45)" stroke-width="1"/>
        <path d="M13 3C13 3 7 7 7 13C7 19 13 23 13 23C13 23 19 19 19 13C19 7 13 3 13 3Z" fill="rgba(226,186,46,.18)" stroke="#e2ba2e" stroke-width="1"/>
        <circle cx="13" cy="13" r="2.8" fill="#e2ba2e"/>
        </svg>
        <span class="nav-lt">Perfect Palate</span>
    </div>
    <div class="nav-links">
        <a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('recommendations.recommendations') }}">Recipes</a>
        <a href="{{ url_for('meal_planner.meal_planner') }}">Meal Plan</a><a href="{{ url_for('meal_planner.favorites') }}">Favourites</a>
        <a href="{{ url_for('meal_planner.shopping_list') }}" class="on">Shopping</a>
        <a href="{{ url_for('logout') }}" title="Log out"><i class="fa-solid fa-right-from-bracket"></i></a>
    </div>
    </nav>

    <div class="pg-head" id="pgHead">
    <div class="pg-left">
        <div class="pg-eye">Weekly groceries</div>
        <h1 class="pg-h1">Shopping <em>List</em></h1>
    </div>
    <div class="prog-ring-wrap">
        <svg class="prog-svg" viewBox="0 0 80 80">
        <circle class="prog-bg" cx="40" cy="40" r="35"/>
        <circle class="prog-arc" cx="40" cy="40" r="35" id="progArc"/>
        <text class="prog-num" x="40" y="37" text-anchor="middle" id="progNum">0/21</text>
        <text class="prog-sub" x="40" y="50" text-anchor="middle">DONE</text>
        </svg>
        <div class="prog-label">Progress</div>
    </div>
    </div>

    <div class="add-bar" id="addBar">
    <i class="fa-solid fa-plus" style="color:rgba(66,110,134,.35);font-size:.75rem;flex-shrink:0"></i>
    <input class="add-inp" id="addInp" type="text" placeholder="Add ingredient… (press Enter)" onkeydown="if(event.key==='Enter')addItem()">
    <select class="add-cat" id="addCat">
        <option value="produce">Produce</option>
        <option value="protein">Protein</option>
        <option value="pantry" selected>Pantry</option>
        <option value="dairy">Dairy</option>
    </select>
    <button class="add-btn" onclick="addItem()"><i class="fa-solid fa-plus"></i> Add</button>
    </div>

    <div class="body" id="listBody"></div>

    <div class="footer-bar" id="footerBar">
    <div class="ft-info">
        <div class="ft-main" id="ftMain">Loading…</div>
        <div class="ft-sub">Generated from your weekly meal plan</div>
    </div>
    <div class="ft-actions">
        <button class="ft-btn" onclick="clearDone()"><i class="fa-solid fa-broom"></i> Clear done</button>
        <button class="ft-btn amber" onclick="shareList()"><i class="fa-solid fa-share-nodes"></i> Share list</button>
    </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>
    </div>

    <script>
    const CATS={
    produce:{name:'Produce',icon:'fa-leaf',cls:'cat-produce'},
    protein:{name:'Proteins',icon:'fa-drumstick-bite',cls:'cat-protein'},
    pantry: {name:'Pantry & Spices',icon:'fa-jar',cls:'cat-pantry'},
    dairy:  {name:'Dairy',icon:'fa-bottle-water',cls:'cat-dairy'},
    };
    let nextId=100;
    let items=[
    {id:1,name:'Tomatoes',qty:'6 large',cat:'produce',src:'Kachumbari',done:true},
    {id:2,name:'Red Onion',qty:'2',cat:'produce',src:'Kachumbari',done:false},
    {id:3,name:'Onions',qty:'3 large',cat:'produce',src:'Pilau ya Nyama',done:false},
    {id:4,name:'Fresh Coriander',qty:'1 bunch',cat:'produce',src:'Kachumbari',done:false},
    {id:5,name:'Green Chili',qty:'3',cat:'produce',src:'Kachumbari',done:false},
    {id:6,name:'Lime',qty:'2',cat:'produce',src:'Kachumbari',done:true},
    {id:7,name:'Garlic',qty:'8 cloves',cat:'produce',src:'Pilau ya Nyama',done:true},
    {id:8,name:'Fresh Ginger',qty:'1 piece',cat:'produce',src:'Masala Chai',done:false},
    {id:9,name:'Beef',qty:'500g',cat:'protein',src:'Pilau ya Nyama',done:false},
    {id:10,name:'Whole Chicken',qty:'1 medium',cat:'protein',src:'Kuku Paka',done:false},
    {id:11,name:'Basmati Rice',qty:'2 cups',cat:'pantry',src:'Pilau ya Nyama',done:false},
    {id:12,name:'Pilau Masala',qty:'2 tbsp',cat:'pantry',src:'Pilau ya Nyama',done:false},
    {id:13,name:'Rice Flour',qty:'2 cups',cat:'pantry',src:'Mkate wa Ufuta',done:false},
    {id:14,name:'Coconut Milk',qty:'3 × 400ml',cat:'pantry',src:'Multiple',done:true},
    {id:15,name:'Sesame Seeds',qty:'2 tbsp',cat:'pantry',src:'Mkate wa Ufuta',done:false},
    {id:16,name:'Sugar',qty:'½ cup',cat:'pantry',src:'Multiple',done:true},
    {id:17,name:'Yeast',qty:'2 tsp',cat:'pantry',src:'Mkate wa Ufuta',done:false},
    {id:18,name:'Black Tea',qty:'3 tsp',cat:'pantry',src:'Masala Chai',done:true},
    {id:19,name:'Cardamom Pods',qty:'6 pods',cat:'pantry',src:'Multiple',done:false},
    {id:20,name:'Cinnamon Sticks',qty:'2',cat:'pantry',src:'Masala Chai',done:false},
    {id:21,name:'Whole Milk',qty:'700ml',cat:'dairy',src:'Masala Chai',done:false},
    ];

    function updateProgress(){
    const done=items.filter(i=>i.done).length,tot=items.length;
    const pct=tot?done/tot:0;
    const circ=220;
    document.getElementById('progArc').style.strokeDashoffset=circ-(circ*pct);
    document.getElementById('progNum').textContent=`${done}/${tot}`;
    const rem=tot-done;
    document.getElementById('ftMain').textContent=`${rem} item${rem!==1?'s':''} remaining · ${done} checked off`;
    }

    function renderList(){
    const body=document.getElementById('listBody');
    body.innerHTML='';
    ['produce','protein','pantry','dairy'].forEach(cat=>{
        const catItems=items.filter(i=>i.cat===cat);
        if(!catItems.length)return;
        const info=CATS[cat];
        const done=catItems.filter(i=>i.done).length;
        const sec=document.createElement('div');
        sec.className=`cat-section ${info.cls}`;
        sec.innerHTML=`
        <div class="cat-head">
            <div class="cat-icon"><i class="fa-solid ${info.icon}"></i></div>
            <div class="cat-name">${info.name}</div>
            <div class="cat-count">${done}/${catItems.length}</div>
        </div>
        <ul class="items-list">
            ${catItems.map(item=>`
            <li class="sl-item${item.done?' done':''}" id="item-${item.id}">
                <div class="cb-wrap" onclick="toggleItem(${item.id})">
                <div class="cb${item.done?' checked':''}"><i class="fa-solid fa-check"></i></div>
                </div>
                <div class="sl-info">
                <div class="sl-name${item.done?' struck':''}">${item.name}</div>
                <div class="sl-qty">${item.qty}</div>
                <span class="sl-src">${item.src}</span>
                </div>
                <button class="sl-del" onclick="deleteItem(${item.id})" title="Remove"><i class="fa-solid fa-xmark"></i></button>
            </li>`).join('')}
        </ul>`;
        body.appendChild(sec);
    });
    updateProgress();
    }

    function toggleItem(id){
    const item=items.find(i=>i.id===id);
    if(!item)return;
    item.done=!item.done;
    const el=document.getElementById(`item-${id}`);
    const cb=el.querySelector('.cb');
    const nm=el.querySelector('.sl-name');
    if(item.done){
        gsap.fromTo(cb,{scale:1},{scale:1.35,duration:.14,ease:'power2.out',yoyo:true,repeat:1});
        setTimeout(()=>{cb.classList.add('checked');nm.classList.add('struck');el.classList.add('done');},120);
    } else {
        cb.classList.remove('checked');nm.classList.remove('struck');el.classList.remove('done');
    }
    setTimeout(()=>{renderList();},150);
    }

    function deleteItem(id){
    const el=document.getElementById(`item-${id}`);
    gsap.to(el,{opacity:0,x:-20,height:0,padding:0,margin:0,duration:.28,ease:'power2.in',onComplete:()=>{
        items=items.filter(i=>i.id!==id);
        renderList();toast('Item removed');
    }});
    }

    function addItem(){
    const inp=document.getElementById('addInp');
    const name=inp.value.trim();
    if(!name)return;
    const cat=document.getElementById('addCat').value;
    items.push({id:nextId++,name,qty:'',cat,src:'Added by you',done:false});
    inp.value='';
    renderList();
    toast(`${name} added!`);
    const newEl=document.getElementById(`item-${nextId-1}`);
    if(newEl)gsap.from(newEl,{opacity:0,x:-16,duration:.3,ease:'power2.out'});
    }

    function clearDone(){
    const count=items.filter(i=>i.done).length;
    items=items.filter(i=>!i.done);
    renderList();
    if(count)toast(`${count} item${count!==1?'s':''} cleared`);
    }

    function shareList(){
    const lines=['produce','protein','pantry','dairy'].flatMap(cat=>{
        const catItems=items.filter(i=>i.cat===cat);
        if(!catItems.length)return[];
        return [`${CATS[cat].name}:`, ...catItems.map(i=>`  - ${i.name} (${i.qty})${i.done?' ✓':''}`)];
    });
    const text=lines.join('\n');
    if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(()=>toast('Shopping list copied to clipboard!'))
        .catch(()=>toast('Could not copy — please copy manually.'));
    } else {
        toast('Clipboard not supported in this browser.');
    }
    }

    function toast(msg){
    const w=document.getElementById('toastWrap'),el=document.createElement('div');
    el.className='toast';el.textContent=msg;w.appendChild(el);
    setTimeout(()=>gsap.to(el,{opacity:0,x:12,duration:.22,onComplete:()=>el.remove()}),2400);
    }

    const tl=gsap.timeline({defaults:{ease:'power3.out'}});
    tl.to('#pgHead',{opacity:1,y:0,duration:.75,delay:.1,from:{y:16,opacity:0}})
    .to('#addBar',{opacity:1,y:0,duration:.5,from:{y:12,opacity:0}},'-=.3')
    .to('#footerBar',{opacity:1,y:0,duration:.45,from:{y:10,opacity:0}},'-=.1');

    renderList();
    setTimeout(()=>{
    gsap.to('.cat-section',{opacity:1,y:0,stagger:.09,duration:.5,ease:'power3.out'});
    },400);
    </script>

{% include '_footer.html' %}
</body>
